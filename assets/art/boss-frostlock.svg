<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
<title id="title">The Frostlock</title>
<desc id="desc">An original ice-armoured clockwork boss with an angular crystal crown, luminous teal eyes, a brass lock at its heart, and four arrow sigils, one imprisoned inside ice.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#304963"/><stop offset=".56" stop-color="#1c3049"/><stop offset="1" stop-color="#162238"/>
  </linearGradient>
  <radialGradient id="aura"><stop stop-color="#a4f6ea" stop-opacity=".5"/><stop offset="1" stop-color="#a4f6ea" stop-opacity="0"/></radialGradient>
  <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#e9ffff"/><stop offset=".37" stop-color="#94dbe5"/><stop offset="1" stop-color="#447aaf"/>
  </linearGradient>
  <linearGradient id="armour" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#a4c5cf"/><stop offset=".56" stop-color="#51768b"/><stop offset="1" stop-color="#314b68"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff1b8"/><stop offset=".58" stop-color="#e0ae72"/><stop offset="1" stop-color="#946a53"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
    <feDropShadow dx="0" dy="12" stdDeviation="7" flood-color="#071323" flood-opacity=".66"/>
  </filter>
</defs>
<rect width="480" height="480" rx="36" fill="url(#back)"/>
<circle cx="237" cy="230" r="205" fill="url(#aura)"/>
<path d="M0 397 71 364l45 22 70-47 58 35 82-39 67 41 87-35v139H0Z" fill="#162c46" opacity=".7"/>
<g fill="none" stroke="#b3edf3" stroke-width="4" stroke-linecap="round" opacity=".5">
  <path d="M52 94h45m-23-22v44m-16-38 32 32m0-32-32 32M372 97h55m-27-27v55m-20-49 39 40m-1-40-38 40"/>
  <path d="M57 289h39m-19-19v39M395 309h37m-19-19v39"/>
</g>
<!-- Body and cold-forged pauldrons -->
<g filter="url(#shadow)" stroke="#1c3047" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
  <path d="M108 426q-8-113 63-153l69-22 77 23q68 55 58 152Z" fill="url(#armour)"/>
  <path d="m133 282-54 51 18 58 70-19 27-87Z" fill="url(#ice)"/>
