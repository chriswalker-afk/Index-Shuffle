  <path d="M173 188q10-69 72-77 58 7 72 80l-20 52-52 23-50-22Z" fill="#263950"/>
  <path d="M166 156 175 95l31 20 30-70 32 59 28-21 30 88-31-21-55-10-40 12Z" fill="url(#ice)"/>
  <path d="m205 117 12-43 21 53 23-29 17 42" stroke="#f0ffff" stroke-width="6" fill="none"/>
  <path d="M191 185l42 3m21 0 43-3" stroke="#a4f7f0" stroke-width="12"/>
