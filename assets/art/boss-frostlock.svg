  <path d="M241 364v16" stroke="#354457" stroke-width="6"/>
</g>
<!-- Three warm directional sigils, one caught in ice -->
<g filter="url(#shadow)" stroke="#273c53" stroke-width="6" stroke-linejoin="round">
