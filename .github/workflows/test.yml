name: Test Index Shuffle
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game engine and blocker tests
        run: |
          node tests.mjs
          node hazards.tests.mjs
          node roguelite.tests.mjs
          node shop.tests.mjs
          node effects.tests.mjs
          node bosses.tests.mjs
          node gold-banking.tests.mjs
          node milestones.tests.mjs
          node navigation.tests.mjs
          node hazard-layer.tests.mjs
          node hazards-live.tests.mjs
          node hazards-balance.tests.mjs
          node hazard-permanents.tests.mjs
          node art-catalog.tests.mjs
          node shop-art.tests.mjs
          node boss-art.tests.mjs
          node world-art.tests.mjs
          node quality-pass5.tests.mjs
      - name: Check JavaScript syntax
        run: |
          node --check engine.mjs
          node --check app.mjs
          node --check tests.mjs
          node --check hazards.tests.mjs
          node --check roguelite.mjs
          node --check roguelite.tests.mjs
          node --check shop.mjs
          node --check shop-ui.mjs
          node --check shop.tests.mjs
          node --check effects.mjs
          node --check effects.tests.mjs
          node --check bosses.mjs
          node --check bosses.tests.mjs
          node --check gold-banking.tests.mjs
          node --check milestones.mjs
          node --check results-ui.mjs
          node --check milestones.tests.mjs
          node --check navigation.mjs
          node --check title-ui.mjs
          node --check navigation.tests.mjs
          node --check hazards.mjs
          node --check hazard-ui.mjs
          node --check hazard-layer.tests.mjs
          node --check hazards-live.tests.mjs
          node --check hazards-balance.tests.mjs
          node --check hazard-permanents.tests.mjs
          node --check art-catalog.mjs
          node --check art-catalog.tests.mjs
          node --check shop-art.mjs
          node --check shop-art.tests.mjs
          node --check boss-scenes.mjs
          node --check boss-art.tests.mjs
          node --check stage-art.mjs
          node --check achievement-art.mjs
          node --check world-art.tests.mjs
          node --check quality-pass5.tests.mjs
      - name: Verify Pages static files
        run: |
          test -f .nojekyll
          test -f index.html
          test -f styles.css
          test -f app.mjs
          test -f engine.mjs
          test -f roguelite.mjs
          test -f shop.mjs
          test -f shop-ui.mjs
          test -f effects.mjs
          test -f bosses.mjs
          test -f milestones.mjs
          test -f results-ui.mjs
          test -f navigation.mjs
          test -f title-ui.mjs
          test -f hazards.mjs
          test -f hazard-ui.mjs
          test -f art-catalog.mjs
          test -f art-preview.html
          test -f assets/art/index-merchant.svg
          test -f assets/art/boss-blockade.svg
          test -f assets/art/boss-five-thief.svg
          test -f assets/art/ART_DIRECTION.md
          test -f shop-art.mjs
          test -f shop-art.tests.mjs
          test -f item-gallery.html
          test -f assets/art/item-sprites.svg
          test -f boss-scenes.mjs
          test -f boss-gallery.html
          test -f assets/art/boss-scorekeeper.svg
          test -f assets/art/boss-silent-seven.svg
          test -f assets/art/boss-power-snob.svg
          test -f assets/art/boss-timekeeper.svg
          test -f assets/art/boss-three-curse.svg
          test -f stage-art.mjs
          test -f achievement-art.mjs
          test -f world-gallery.html
          test -f assets/art/title-numberworld.svg
          test -f assets/art/stage-observatory.svg
          test -f assets/art/stage-mist-gardens.svg
          test -f assets/art/stage-fracture-forge.svg
          test -f assets/art/stage-eclipse-vault.svg
          test -f assets/art/hazard-cloudy.svg
          test -f assets/art/hazard-void.svg
          test -f assets/art/hazard-null.svg
          test -f assets/art/hazard-cracked.svg
          test -f assets/art/hazard-greedy.svg
          test -f assets/art/achievement-trophy.svg
          test -f assets/art/achievement-medals.svg
      - name: Validate item sprite XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('assets/art/item-sprites.svg')"
      - name: Validate all boss portrait SVGs
        run: |
          python3 -c "import glob, xml.etree.ElementTree as ET; [ET.parse(path) for path in glob.glob('assets/art/boss-*.svg')]"
      - name: Validate Pass 4 SVG scene, hazard and award assets
        run: |
          python3 -c "import glob, xml.etree.ElementTree as ET; paths = glob.glob('assets/art/stage-*.svg') + glob.glob('assets/art/hazard-*.svg') + ['assets/art/title-numberworld.svg', 'assets/art/achievement-trophy.svg', 'assets/art/achievement-medals.svg']; [ET.parse(path) for path in paths]; assert len(paths) == 12"
