name: Test Index Shuffle
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game engine and blocker tests
        run: |
          node tests.mjs
          node hazards.tests.mjs
      - name: Check JavaScript syntax
        run: |
          node --check engine.mjs
          node --check app.mjs
          node --check tests.mjs
          node --check hazards.tests.mjs
      - name: Verify Pages static files
        run: |
          test -f .nojekyll
          test -f index.html
          test -f styles.css
          test -f app.mjs
          test -f engine.mjs
