name: Verify live Index Shuffle custom domain
on:
  pull_request:
    paths:
      - .github/workflows/verify-live-domain.yml
      - scripts/verify-live-domain.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check live HTTPS, artwork assets and old address redirect
        run: node scripts/verify-live-domain.mjs
