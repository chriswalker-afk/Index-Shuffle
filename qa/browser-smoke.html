<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Index Shuffle · Pass 5 browser smoke test</title>
  <style>
    body { margin: 0; padding: 20px; background: #172135; color: #fff; font: 14px system-ui, sans-serif; }
    iframe { display: block; width: 320px; height: 900px; border: 2px solid #72e9ce; }
    #result { white-space: pre-wrap; word-break: break-word; padding: 16px;
      border: 1px solid #95aeca; border-radius: 9px; max-width: 70ch; }
    #result[data-result="pass"] { border-color: #96efd5; }
    #result[data-result="fail"] { border-color: #ffb0a0; }
  </style>
</head>
<body>
  <h1>Pass 5 browser smoke test</h1>
  <pre id="result" role="status" data-result="running">RUNNING: Waiting for game iframe</pre>
  <iframe id="game" title="Index Shuffle browser QA" src="../"></iframe>
  <script>
    "use strict";
    const result = document.getElementById("result");
    const frame = document.getElementById("game");
    const logs = [];
    const assert = (ok, description) => {
      if (!ok) throw new Error(description);
      logs.push("PASS " + description);
    };
    const tick = () => new Promise(resolve =>
      frame.contentWindow.requestAnimationFrame(() =>
        frame.contentWindow.requestAnimationFrame(resolve)));
    const width = async value => {
      frame.style.width = value + "px";
      await tick();
      const documentElement = frame.contentDocument.documentElement;
      assert(documentElement.scrollWidth <= documentElement.clientWidth + 2,
        value + "px: no horizontal overflow (" + documentElement.scrollWidth + " / " +
        documentElement.clientWidth + ")");
    };
    function finish(kind, line) {
      result.dataset.result = kind;
      result.textContent = (kind === "pass" ? "PASS: " : "FAIL: ") +
        line + "\n\n" + logs.join("\n");
    }
    async function run() {
      try {
        // iframe load waits for the real module graph to finish executing.
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        const $ = id => doc.getElementById(id);
        assert(Boolean($("titleScreen") && !$("titleScreen").hidden),
          "title screen is visible and app module has initialized");
        assert($("titleNew") && !($("titleNew").disabled),
          "new game button is available");
        assert(win.localStorage.getItem("index-shuffle-v1") === null &&
          win.localStorage.getItem("index-shuffle-roguelite-v1") === null,
          "visiting the title alone does not create a phantom game save");
        assert($("saveWarning").hidden, "save warning is hidden when storage works");
        assert($("modal") instanceof win.HTMLDialogElement,
          "banking uses a native dialog element");
        assert(!$("modal").open, "banking dialog starts closed");
        await width(320);
        await width(390);
        $("titleNew").click();
        assert(!$("newGameScreen").hidden, "mode selection opens");
        $("modeClassic").click();
        assert(!$("gameScreen").hidden, "Classic game starts");
        assert($("stageScene").hidden, "Classic is not decorated with a Roguelike stage");
        const board = $("board");
        assert(board.getAttribute("role") === "group", "board is an accessible group");
        assert(board.querySelectorAll(":scope > button.cell").length === 16,
          "game board has sixteen native button squares");
        assert([...board.querySelectorAll(":scope > button.cell")].every(b =>
          b.getAttribute("aria-label")?.startsWith("Row ") &&
          !b.hasAttribute("role")),
          "all sixteen squares are labelled by position and keep button semantics");
        // Regression: the skip link must not float into the page title.
        // It remains keyboard-reachable and reveals in normal flow on focus.
        const skipLink = doc.querySelector("#gameScreen .skip-game-board");
        assert(skipLink instanceof win.HTMLAnchorElement,
          "keyboard shortcut to maths board exists");
        assert(win.getComputedStyle(skipLink).clipPath !== "none",
          "unfocused skip link is visually clipped");
        skipLink.focus();
        await tick();
        const skipRect = skipLink.getBoundingClientRect();
        const headerRect = doc.querySelector(".top").getBoundingClientRect();
        const gameRect = $("gameScreen").getBoundingClientRect();
        const playingRect = doc.querySelector(".playing-head").getBoundingClientRect();
        assert(win.getComputedStyle(skipLink).clipPath === "none",
          "skip link becomes visible on keyboard focus");
        assert(skipRect.top >= headerRect.bottom - 1 &&
          skipRect.top >= gameRect.top - 1,
          "focused skip link is below the site title");
        assert(skipRect.bottom <= playingRect.top + 2,
          "focused skip link does not cover the game heading");
        skipLink.blur();
        await tick();
        assert(win.getComputedStyle(skipLink).clipPath !== "none",
          "skip link hides again after leaving focus");
        for (const size of [320, 390, 650, 768, 1200]) {
          await width(size);
          const isMobile = size <= 650;
          const barDisplay = win.getComputedStyle($("mobileStatus")).display;
          assert(isMobile ? barDisplay === "grid" : barDisplay === "none",
            size + "px: quick status shown only on phones");
          if (isMobile) {
            assert($("mobileRoundTarget").hidden, size + "px: Classic has no round target");
            assert(board.getBoundingClientRect().top < $("movesCard").getBoundingClientRect().top,
              size + "px: board precedes detailed HUD");
            assert($("mobileStatus").getBoundingClientRect().bottom <= board.getBoundingClientRect().top,
              size + "px: quick budget is immediately above the board");
          }
        }
        await width(390);
        const dialog = $("modal");
        dialog.showModal();
        $("answer").focus();
        assert(dialog.open && doc.activeElement === $("answer"),
          "native banking modal opens and focuses numeric answer");
        assert(win.getComputedStyle(dialog).display !== "none",
          "banking modal is visually open");
        dialog.close();
        assert(!dialog.open && win.getComputedStyle(dialog).display === "none",
          "native banking modal closes cleanly");
        $("headerTitle").click();
        assert(!$("titleScreen").hidden, "returning to title works");
        $("titleNew").click();
        $("modeRoguelite").click();
        assert(!$("gameScreen").hidden, "Roguelike game starts");
        assert(!$("stageScene").hidden && $("stageSceneTitle").textContent.length > 2,
          "stage art and stage name render in Roguelike");
        assert(!$("mobileRoundTarget").hidden, "Roguelike quick HUD shows round target");
        assert($("mobileMovesLeft").textContent === $("movesLeft").textContent,
          "quick budget matches full HUD");
        assert($("mobileRoundScore").textContent === $("rogueScore").textContent,
          "quick target matches full HUD");
        await width(320);
        assert($("board").getBoundingClientRect().top < $("movesCard").getBoundingClientRect().top,
          "Roguelike board-first layout holds at 320px");
        assert($("stageSceneImage").getAttribute("src")?.includes("stage-observatory.svg"),
          "current-stage art is loaded only for the actual stage");

        // Resume a deterministic saved Frostlock encounter. This exercises
        // the real UI and keyboard handler without any hidden game shortcut
        // or changes to source mechanics.
        $("headerTitle").click();
        const key = "index-shuffle-roguelite-v1";
        const saved = JSON.parse(win.localStorage.getItem(key));
        assert(Boolean(saved?.run), "Roguelike save exists for Frostlock continuation");
        saved.board = Array(16).fill(null);
        saved.board[5] = { base: 2, exp: 1 };
        saved.board[10] = { base: 3, exp: 1 };
        saved.hazards = Array(16).fill(null);
        saved.banked = []; saved.locked = []; saved.mergeReady = [];
        saved.moves = 0; saved.movesLeft = 10; saved.score = 0;
        saved.over = false;
        saved.run.round = 6;
        saved.run.phase = "playing";
        saved.run.totalSlides = 0;
        saved.run.hazardWarning = null;
        saved.run.hazardCooldown = 0;
        saved.run.bosses = { 3: "blockade", 6: "frostlock",
          9: "scorekeeper", 12: "silent-seven" };
        saved.run.frozenDirection = "left";
        win.localStorage.setItem(key, JSON.stringify(saved));
        $("titleContinue").click();
        const resume = [...$("continueSlots").querySelectorAll("button")]
          .find(b => b.getAttribute("aria-label")?.includes("Roguelike"));
        assert(Boolean(resume), "Saved Frostlock run appears in Continue");
        resume.click();
        await tick();
        assert($("bossName").textContent === "The Frostlock",
          "saved Frostlock round restores its boss identity");
        assert(!$("frostlockStatus").hidden &&
          $("frostlockDirection").textContent.startsWith("LEFT"),
          "current frozen direction appears beside controls");
        const buttons = [...doc.querySelectorAll(".controls [data-dir]")];
        assert(buttons.filter(b => b.disabled).length === 1 &&
          buttons.find(b => b.dataset.dir === "left")?.disabled,
          "exactly the LEFT arrow button is frozen initially");
        const budgetBefore = $("movesLeft").textContent;
        doc.dispatchEvent(new win.KeyboardEvent("keydown", {
          key: "ArrowLeft", bubbles: true, cancelable: true
        }));
        assert($("movesLeft").textContent === budgetBefore &&
          buttons.find(b => b.dataset.dir === "left")?.disabled,
          "pressing the frozen arrow does not use moves or reroll");
        doc.dispatchEvent(new win.KeyboardEvent("keydown", {
          key: "ArrowRight", bubbles: true, cancelable: true
        }));
        await tick();
        assert(Number($("movesLeft").textContent) < Number(budgetBefore),
          "an unfrozen direction still moves and costs the usual move");
        const after = JSON.parse(win.localStorage.getItem(key));
        assert(after.run.frozenDirection !== "left",
          "a successful move selects a different frozen direction");
        assert(buttons.filter(b => b.disabled).length === 1 &&
          buttons.find(b => b.dataset.dir === after.run.frozenDirection)?.disabled,
          "exactly the newly frozen arrow is disabled");
        assert($("frostlockDirection").textContent.length >= 4,
          "new frozen direction is announced in the status area");
        // The selection is persisted and does not change on resume.
        $("headerTitle").click();
        $("titleContinue").click();
        const resumeAgain = [...$("continueSlots").querySelectorAll("button")]
          .find(b => b.getAttribute("aria-label")?.includes("Roguelike"));
        resumeAgain.click();
        await tick();
        const restored = [...doc.querySelectorAll(".controls [data-dir]")]
          .find(b => b.disabled)?.dataset.dir;
        assert(restored === after.run.frozenDirection,
          "reloading a Frostlock run preserves its frozen control");

        // A failed durable save must be visibly disclosed and kept in memory
        // so Continue remains usable in the same tab. No real game progress
        // or virtual currency is invented by this fallback.
        const originalWrite = win.Storage.prototype.setItem;
        try {
          win.Storage.prototype.setItem = function () {
            throw new Error("simulated QuotaExceededError");
          };
          $("headerTitle").click();
          assert(!$("saveWarning").hidden &&
            $("saveWarning").textContent.includes("not being saved"),
            "unavailable browser storage produces an accessible warning");
          $("titleContinue").click();
          const recover = [...$("continueSlots").querySelectorAll("button")]
            .find(b => b.getAttribute("aria-label")?.includes("Roguelike"));
          assert(Boolean(recover),
            "an in-tab backup permits Continue after a storage failure");
          recover.click();
          await tick();
          assert($("bossName").textContent === "The Frostlock",
            "memory fallback restores the existing saved boss encounter");
        } finally {
          win.Storage.prototype.setItem = originalWrite;
        }
        $("headerTitle").click();
        assert($("saveWarning").hidden,
          "warning clears after game and achievements save successfully again");

        // Verify that the actual document Escape shortcut cannot bypass
        // the time penalty on a banking question.
        const bankSave = JSON.parse(win.localStorage.getItem(key));
        bankSave.board = Array(16).fill(null);
        bankSave.board[0] = { base: 2, exp: 2 };
        bankSave.board[1] = { base: 3, exp: 1 };
        bankSave.banked = []; bankSave.locked = []; bankSave.mergeReady = [];
        bankSave.hazards = Array(16).fill(null);
        bankSave.enchantments = Array(16).fill(null);
        bankSave.movesLeft = 7; bankSave.over = false;
        bankSave.run.round = 4; bankSave.run.phase = "playing";
        bankSave.run.frozenDirection = null;
        bankSave.run.hazardWarning = null;
        win.localStorage.setItem(key, JSON.stringify(bankSave));
        $("titleContinue").click();
        const bankResume = [...$("continueSlots").querySelectorAll("button")]
          .find(button => button.getAttribute("aria-label")?.includes("Roguelike"));
        assert(Boolean(bankResume), "deterministic banking save can be continued");
        bankResume.click();
        await tick();
        $("board").children[0].click();
        assert($("modal").open, "bankable question opens for Escape regression");
        doc.dispatchEvent(new win.KeyboardEvent("keydown", {
          key: "Escape", bubbles: true, cancelable: true
        }));
        assert(!$("modal").open, "Escape closes the banking question");
        assert(JSON.parse(win.localStorage.getItem(key)).locked.includes(0),
          "Escape cancels and persists the one-slide banking lock");
        finish("pass", logs.length + " interactive layout/semantics checks");
      } catch (error) {
        finish("fail", String(error && error.stack || error));
      }
    }
    frame.addEventListener("load", run, { once: true });
  </script>
</body>
</html>
